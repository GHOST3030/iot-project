; ============================================================
; Smart Fire Detection & Water Extinguishing System (MVP)
; Target: ESP32 DevKit V1  |  Framework: Arduino
; ------------------------------------------------------------
; This file tells PlatformIO how to build the firmware.
; The same firmware runs in Wokwi (simulation) and on real
; hardware without changes.
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Serial monitor speed (must match Serial.begin() in main.cpp)
monitor_speed = 115200

; Third-party libraries
lib_deps =
    blynkkk/Blynk@^1.3.2
